<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Essay writing | Scholar's Quest</title><link rel="stylesheet" href="styles.css" /></head>
  <body><div class="page-shell"><header class="page-header"><a class="back-link" href="index.html">← Home</a><p class="eyebrow">ROOM 02 / WRITING</p><h1>Essay writing</h1><p>Write one paragraph, then connect it to evidence.</p></header><main class="page-content"><section class="panel essay-room"><div class="panel-heading"><div class="section-icon orange">✎</div><div><h2>Draft a paragraph</h2><p>Keep the task small. One claim is enough to begin.</p></div></div><form id="paragraph-form"><div class="form-group"><label for="paragraph-text">Your paragraph</label><textarea id="paragraph-text" rows="12" required placeholder="Start with one clear claim..."></textarea></div><div class="form-group"><label for="paragraph-sources">Source IDs <span class="label-hint">comma separated</span></label><input id="paragraph-sources" required placeholder="src-xxxx, src-yyyy" /></div><button type="submit" class="button primary">Link paragraph <span>→</span></button></form><div id="paragraph-result" class="result"></div></section></main><script src="app.js"></script></div></body>
</html>
