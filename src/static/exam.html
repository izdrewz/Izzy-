  <body><div class="page-shell"><header class="page-header"><a class="back-link" href="index.html">← Home</a><p class="eyebrow">ROOM 03 / EXAM</p><h1>Exam planning</h1><p>Make the question smaller and the answer clearer.</p></header><main class="page-content"><section class="panel exam-room"><div class="panel-heading"><div class="section-icon teal">◈</div><div><h2>Build a plan</h2><p>Turn the wording of the question into a structure you can use.</p></div></div><form id="exam-form"><div class="form-group"><label for="exam-question">Exam question</label><textarea id="exam-question" rows="7" required placeholder="Paste your exam question"></textarea></div><div class="form-group"><label for="exam-guidance">Teacher guidance <span class="label-hint">optional</span></label><input id="exam-guidance" placeholder="e.g. include context in every paragraph" /></div><button type="submit" class="button primary">Build my plan <span>→</span></button></form><div id="exam-result" class="result"></div></section></main><script src="app.js"></script></div></body>
